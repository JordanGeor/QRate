{% extends "base.html" %}
{% block content %}

<div class="header">
  <a class="back" href="/admin">← Dashboard</a>
  <h1>Νέος Πελάτης / Κατάστημα</h1>
</div>

<div class="card">
  {% if error %}
    <p class="error">{{ error }}</p>
  {% endif %}

  <form method="post" action="/admin/users/create">
    <h2>Στοιχεία Καταστήματος</h2>

    <label>Slug (για QR URL)</label>
    <input name="slug" placeholder="Όνομα_Καταστήματος" required>

    <label>Όνομα Καταστήματος</label>
    <input name="name_el" placeholder="Όνομα Καταστήματος" required>

    <h2>Κωδικοί Ιδιοκτήτη</h2>

    <label>Username</label>
    <input name="username" placeholder="username" required>

    <label>Password</label>
    <input name="password" type="text" required>

    <button class="btn full" type="submit">
      Create Restaurant + Owner
    </button>
  </form>
</div>

{% endblock %}
