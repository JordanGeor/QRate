{% extends "base.html" %}
{% block content %}
<div class="header">
  <a class="back" href="/admin">← Dashboard</a>
  <h1>Αξιολογήσεις: {{ r.name_el }}</h1>
</div>

{% for rv in reviews %}
<div class="card">
  <div class="muted">{{ rv.created_at }}</div>
  <div class="grid2">
    <div> <b>{{ rv.reception }}</b></div>
  </div>
  {% if rv.notes %}<p>{{ rv.notes }}</p>{% endif %}
</div>
{% endfor %}
{% endblock %}
