{% extends "base.html" %}
{% block content %}
<div class="card center">
  <h1>{{ tr(lang,"Επικοινωνία","Contact") }}</h1>
  <p class="muted">
    {{ tr(lang,
      "Στείλε μας μήνυμα και θα επικοινωνήσουμε σύντομα.",
      "Send us a message and we’ll get back to you soon.") }}
  </p>

  <form method="post" action="/r/{{ r.slug }}/contact?lang={{ lang }}" style="text-align:left;">
    <input type="hidden" name="rid" value="{{ rid }}">

    <label class="muted">{{ tr(lang,"Όνομα","Name") }}</label>
    <input type="text" name="name" autocomplete="name">

    <label class="muted">{{ tr(lang,"Email","Email") }}</label>
    <input type="email" name="email" autocomplete="email">

    <label class="muted">{{ tr(lang,"Τηλέφωνο","Phone") }}</label>
    <input type="tel" name="phone" autocomplete="tel">

    <label class="muted">{{ tr(lang,"Μήνυμα","Message") }}</label>
    <textarea name="message" required rows="5"></textarea>

    <div class="btns" style="margin-top:12px;">
      <button class="btn" type="submit">{{ tr(lang,"Αποστολή","Send") }}</button>
      <a class="btn secondary" href="/r/{{ r.slug }}/thanks?lang={{ lang }}{% if rid %}&rid={{ rid }}{% endif %}">
        {{ tr(lang,"Πίσω","Back") }}
      </a>
    </div>
  </form>
</div>
{% endblock %}
